<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wort Rater</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body {
    width: 100%; min-height: 100%; background: #0d1014; color: #e8ebee;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
    -webkit-font-smoothing: antialiased; overscroll-behavior-y: none;
  }
  :root {
    --bg: #0d1014; --surface: rgba(255, 255, 255, 0.04); --border: rgba(255, 255, 255, 0.08);
    --border-strong: rgba(255, 255, 255, 0.18); --text: #e8ebee; --sub: #8b9099;
    --success: #34d399; --error: #f87171;
  }
  .app { max-width: 520px; margin: 0 auto; padding: 40px 24px 60px; min-height: 100vh; display: flex; flex-direction: column; gap: 28px; }
  header { display: flex; flex-direction: column; gap: 22px; align-items: center; }
  .logo { font-size: 34px; font-weight: 700; letter-spacing: -1.5px; color: var(--text); line-height: 1; }
  main { flex: 1; display: flex; flex-direction: column; }
  .panel { display: none; flex-direction: column; gap: 20px; animation: fadeIn 0.25s ease-out; }
  .panel.active { display: flex; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes revealDown { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }

  input[type="number"], input[type="text"] {
    width: 100%; padding: 18px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; color: var(--text); font-family: inherit; font-size: 16px; outline: none;
    transition: border-color 0.18s ease; -webkit-appearance: none;
  }
  input[type="number"]:focus, input[type="text"]:focus { border-color: var(--border-strong); }
  input::placeholder { color: var(--sub); }

  .primary-btn {
    width: 100%; padding: 17px; border: none; background: var(--text); color: var(--bg);
    font-size: 15px; font-weight: 700; letter-spacing: 0.5px; border-radius: 100px;
    cursor: pointer; font-family: inherit; transition: all 0.15s ease; text-align: center;
  }
  .primary-btn:active { transform: scale(0.98); opacity: 0.9; }
  .primary-btn:disabled { opacity: 0.35; cursor: default; transform: none; }

  .secondary-btn {
    padding: 17px; background: transparent; border: 1px solid var(--border); color: var(--text);
    border-radius: 100px; font-family: inherit; font-size: 15px; font-weight: 700;
    letter-spacing: 0.5px; cursor: pointer; transition: all 0.15s ease; text-align: center;
  }
  .secondary-btn:active { background: var(--surface); transform: scale(0.97); }

  .menu-buttons { display: flex; flex-direction: column; gap: 16px; margin-top: 20px; }

  .boxes-container {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    width: 100%;
    margin-bottom: 10px;
  }
  
  .letter-box {
    width: 48px; height: 56px; background: #1c2026; border: 2px solid #3c4149; border-radius: 12px;
    color: #ffffff; font-size: 24px; font-weight: 700; text-align: center; text-transform: lowercase;
    outline: none; transition: all 0.18s ease; caret-color: transparent;
  }
  .letter-box:focus { border-color: #ffffff; background: #2a2f36; box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.1); }

  .checkbox-group { display: flex; align-items: center; gap: 12px; padding: 12px 0; cursor: pointer; user-select: none; color: var(--text); font-size: 15px; }
  .checkbox-group input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--text); cursor: pointer; }
  .limited-input-container { animation: revealDown 0.3s ease-out; }

  .results-container {
    display: flex;
    flex-direction: column;
    gap: 10px;
    animation: revealDown 0.3s ease-out;
  }
  .result-item {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 16px;
    border-radius: 12px;
    font-size: 20px;
    font-weight: 700;
    color: var(--success);
    text-align: center;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .error-msg { font-size: 13px; color: var(--error); text-align: center; padding: 14px; background: rgba(248, 113, 113, 0.08); border-radius: 12px; border: 1px solid rgba(248, 113, 113, 0.2); transition: all 0.3s ease; }
  .loading-text { text-align: center; color: var(--sub); font-size: 14px; padding: 10px; }
  
  .upload-zone {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 56px 24px; border: 2px dashed var(--border-strong); border-radius: 20px;
    cursor: pointer; transition: all 0.18s ease; color: var(--sub); font-size: 14px;
    text-align: center; font-weight: 500; letter-spacing: 0.3px;
  }
  .upload-zone:active { background: var(--surface); border-color: var(--text); color: var(--text); }
  .upload-zone svg { width: 44px; height: 44px; stroke: currentColor; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; opacity: 0.55; }

  .hidden { display: none !important; }
  
  @media (max-width: 400px) {
    .app { padding: 32px 18px 50px; }
    .logo { font-size: 30px; }
    .letter-box { width: 40px; height: 48px; font-size: 20px; }
  }
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="logo">wort rater</div>
  </header>

  <main>
    <!-- START MENU PANEL -->
    <section id="panel-menu" class="panel active">
      <div class="menu-buttons">
        <button id="modeManualBtn" class="secondary-btn">manual</button>
        <button id="modeAutoBtn" class="primary-btn">auto (bild hochladen)</button>
      </div>
    </section>

    <!-- AUTO UPLOAD PANEL -->
    <section id="panel-auto" class="panel">
      <label class="upload-zone" for="imageInput">
        <svg viewBox="0 0 24 24">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
        <span>tap to upload screenshot</span>
      </label>
      <input type="file" id="imageInput" accept="image/*" hidden>
      
      <div id="autoLoading" class="loading-text hidden">analysiere bild...<br><span style="font-size:12px; opacity:0.7;">(dauert ca. 5-10 sekunden)</span></div>
      <div id="autoError" class="error-msg hidden"></div>
      
      <button id="autoBackBtn" class="secondary-btn" style="margin-top:20px;">zurück</button>
    </section>

    <!-- SETUP PANEL (Manual) -->
    <section id="panel-setup" class="panel">
      <div id="loadingStatus" class="loading-text hidden"></div>
      <input type="number" id="lengthInput" placeholder="wie viele buchstaben?" min="1" max="40" autocomplete="off">
      <button id="startBtn" class="primary-btn" disabled>starten</button>
      <div id="setupError" class="error-msg hidden"></div>
      <button id="setupBackBtn" class="secondary-btn" style="margin-top:20px;">zurück</button>
    </section>

    <!-- GAME PANEL -->
    <section id="panel-game" class="panel">
      <div id="boxesContainer" class="boxes-container"></div>
      
      <label class="checkbox-group">
        <input type="checkbox" id="limitedCheckbox">
        eingeschränkte buchstaben
      </label>
      
      <div id="limitedContainer" class="limited-input-container hidden">
        <input type="text" id="limitedInput" placeholder="erlaubte buchstaben (z.b. hallo)" autocomplete="off" autocapitalize="off" spellcheck="false">
      </div>

      <button id="guessBtn" class="primary-btn">raten</button>
      <button id="resetBtn" class="secondary-btn">neu starten</button>
      
      <div id="gameError" class="error-msg hidden"></div>
      
      <div id="resultsContainer" class="results-container hidden">
        <div id="resultsList" style="display: flex; flex-direction: column; gap: 10px;"></div>
        <button id="loadMoreBtn" class="secondary-btn hidden" style="margin-top: 10px;">mehr laden</button>
      </div>
    </section>
  </main>
</div>

<script>
(() => {
'use strict';

let dictionaryByLength = {}; 

// UI Elements
const panelMenu = document.getElementById('panel-menu');
const panelAuto = document.getElementById('panel-auto');
const panelSetup = document.getElementById('panel-setup');
const panelGame = document.getElementById('panel-game');

const modeManualBtn = document.getElementById('modeManualBtn');
const modeAutoBtn = document.getElementById('modeAutoBtn');
const autoBackBtn = document.getElementById('autoBackBtn');
const setupBackBtn = document.getElementById('setupBackBtn');

const imageInput = document.getElementById('imageInput');
const autoLoading = document.getElementById('autoLoading');
const autoError = document.getElementById('autoError');

const lengthInput = document.getElementById('lengthInput');
const startBtn = document.getElementById('startBtn');
const setupError = document.getElementById('setupError');
const loadingStatus = document.getElementById('loadingStatus');

const boxesContainer = document.getElementById('boxesContainer');
const limitedCheckbox = document.getElementById('limitedCheckbox');
const limitedContainer = document.getElementById('limitedContainer');
const limitedInput = document.getElementById('limitedInput');
const guessBtn = document.getElementById('guessBtn');
const resetBtn = document.getElementById('resetBtn');
const gameError = document.getElementById('gameError');

const resultsContainer = document.getElementById('resultsContainer');
const resultsList = document.getElementById('resultsList');
const loadMoreBtn = document.getElementById('loadMoreBtn');

let wordLength = 0;
let boxes = [];

let allMatches = [];
let displayedCount = 0;
const BATCH_SIZE = 10;

// --- MENU LOGIC ---
modeManualBtn.addEventListener('click', () => {
  panelMenu.classList.remove('active');
  panelSetup.classList.add('active');
  lengthInput.focus();
});

modeAutoBtn.addEventListener('click', () => {
  panelMenu.classList.remove('active');
  panelAuto.classList.add('active');
});

autoBackBtn.addEventListener('click', () => {
  panelAuto.classList.remove('active');
  panelMenu.classList.add('active');
  autoError.classList.add('hidden');
});

setupBackBtn.addEventListener('click', () => {
  panelSetup.classList.remove('active');
  panelMenu.classList.add('active');
  setupError.classList.add('hidden');
});

// --- AUTO OCR LOGIC ---
imageInput.addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  
  autoError.classList.add('hidden');
  autoLoading.classList.remove('hidden');
  
  try {
    const img = new Image();
    img.src = URL.createObjectURL(file);
    await new Promise(r => img.onload = r);
    
    // 1. Detect Word Length (scan the middle area for the empty boxes)
    const detectedLength = detectWordLength(img);
    
    // 2. Crop the bottom area specifically for the letter tiles
    const canvas = document.createElement('canvas');
    // From 60% down to 90% (height), ignore right 15% (buttons)
    const cropY = Math.floor(img.height * 0.60); 
    const cropH = Math.floor(img.height * 0.30); 
    const cropW = Math.floor(img.width * 0.85);
    
    // Scale up 2x for better recognition
    canvas.width = cropW * 2;
    canvas.height = cropH * 2;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, cropY, cropW, cropH, 0, 0, canvas.width, canvas.height);

    // 3. Run Tesseract (No crazy thresholding, just let it do its job)
    const result = await Tesseract.recognize(canvas, 'eng', {
      tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
      tessedit_pageseg_mode: '11' // Sparse text
    });
    
    // 4. Filter for single capital letters
    const validLetters = [];
    for (const word of result.data.words) {
      if (word.text.length !== 1) continue; 
      if (!word.text.match(/[A-Z]/i)) continue; 
      
      // Must be a reasonably large tile
      const w = word.bbox.x1 - word.bbox.x0;
      const h = word.bbox.y1 - word.bbox.y0;
      if (h > 25) {
        validLetters.push(word.text.toUpperCase());
      }
    }

    // Fallback length if detection failed or if it doesn't make sense
    let finalLength = detectedLength;
    if (finalLength < 3 || finalLength > 15) {
      finalLength = Math.max(3, Math.round(validLetters.length / 1.8));
    }
    
    // Start Game with auto=true flag
    initGame(finalLength, validLetters.join(''), true);

  } catch (err) {
    console.error(err);
    autoError.textContent = 'OCR fehlgeschlagen. Bitte manuell versuchen.';
    autoError.classList.remove('hidden');
  } finally {
    autoLoading.classList.add('hidden');
    imageInput.value = '';
  }
});

// Helper: Scans the middle of the image to count the empty boxes
function detectWordLength(img) {
  const canvas = document.createElement('canvas');
  canvas.width = img.width;
  canvas.height = img.height;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, 0, 0);
  const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;

  let bestCount = 0;
  
  // Scan exactly in the middle band where the empty boxes usually are (45% to 55%)
  for (let y = Math.floor(img.height * 0.45); y < Math.floor(img.height * 0.55); y += 2) {
    let transitions = 0;
    let inBox = false;
    
    // Ignore edges of the screen
    for (let x = Math.floor(img.width * 0.15); x < Math.floor(img.width * 0.85); x++) {
      const i = (y * img.width + x) * 4;
      const brightness = (data[i] + data[i+1] + data[i+2]) / 3;
      
      // The empty boxes have a distinct dark blue (around brightness 20-80)
      const isBox = brightness > 20 && brightness < 80;
      
      if (isBox && !inBox) {
        transitions++;
        inBox = true;
      } else if (!isBox && inBox) {
        inBox = false;
      }
    }
    
    // If we found a row with a realistic number of boxes (4 to 12)
    if (transitions > bestCount && transitions >= 4 && transitions <= 12) {
      bestCount = transitions;
    }
  }
  return bestCount;
}

// --- SETUP LOGIC (Manual) ---
lengthInput.addEventListener('input', () => {
  const val = parseInt(lengthInput.value, 10);
  startBtn.disabled = !(val > 0 && val <= 40);
  setupError.classList.add('hidden');
});

startBtn.addEventListener('click', async () => {
  const val = parseInt(lengthInput.value, 10);
  if (!val || val < 1 || val > 40) return;
  await loadDictionaryForLength(val);
  initGame(val, '', false);
});

// --- GAME LOGIC ---
async function loadDictionaryForLength(val) {
  if (!dictionaryByLength[val]) {
    startBtn.disabled = true;
    startBtn.textContent = 'lade wörter...';
    loadingStatus.textContent = 'lade wörterbuch für ' + val + ' buchstaben...';
    loadingStatus.classList.remove('hidden');
    
    try {
      const response = await fetch(`words-${val}.txt`);
      if (response.ok) {
        const text = await response.text();
        dictionaryByLength[val] = text.split('\n').map(w => w.trim().toLowerCase()).filter(w => w.length > 0);
      } else {
        dictionaryByLength[val] = []; 
      }
    } catch (err) {
      console.warn('Fetch failed.', err);
      dictionaryByLength[val] = []; 
      setupError.textContent = 'Hinweis: words-' + val + '.txt konnte nicht geladen werden.';
      setupError.classList.remove('hidden');
    }
    
    loadingStatus.classList.add('hidden');
    startBtn.textContent = 'starten';
    startBtn.disabled = false;
  }
}

function initGame(val, prefilledLetters, isAuto) {
  wordLength = val;
  panelSetup.classList.remove('active');
  panelAuto.classList.remove('active');
  panelMenu.classList.remove('active');
  panelGame.classList.add('active');
  
  boxesContainer.innerHTML = '';
  boxes = [];
  
  for (let i = 0; i < wordLength; i++) {
    const input = document.createElement('input');
    input.type = 'text';
    input.className = 'letter-box';
    input.maxLength = 1;
    input.autocomplete = 'off';
    input.autocapitalize = 'off';
    input.spellcheck = false;
    
    input.addEventListener('input', (e) => {
      let char = e.target.value.toLowerCase();
      
      if (char === ' ') {
        e.target.value = '';
        if (i < wordLength - 1) boxes[i + 1].focus();
        return;
      }

      if (char.length === 1) {
        e.target.value = char;
        if (i < wordLength - 1) boxes[i + 1].focus();
      }
      resultsContainer.classList.add('hidden');
      resetGameError();
    });

    input.addEventListener('keydown', (e) => {
      if (e.key === ' ' && !e.target.value) {
        e.preventDefault();
        if (i < wordLength - 1) boxes[i + 1].focus();
        return;
      }
      if (e.key === 'Backspace' && !e.target.value && i > 0) {
        boxes[i - 1].focus();
      } else if (e.key === 'ArrowLeft' && i > 0) {
        boxes[i - 1].focus();
      } else if (e.key === 'ArrowRight' && i < wordLength - 1) {
        boxes[i + 1].focus();
      } else if (e.key === 'Enter') {
        guessBtn.click();
      }
    });

    boxesContainer.appendChild(input);
    boxes.push(input);
  }
  
  // Handle prefilled letters
  limitedCheckbox.checked = false;
  limitedInput.value = '';
  limitedContainer.classList.add('hidden');
  
  if (prefilledLetters) {
    limitedCheckbox.checked = true;
    limitedContainer.classList.remove('hidden');
    limitedInput.value = prefilledLetters.toLowerCase();
  }
  
  resultsContainer.classList.add('hidden');
  
  // Show review message if coming from Auto
  if (isAuto) {
    gameError.textContent = `Auto: ${val} Kästchen, ${prefilledLetters.length} Buchstaben erkannt. Bitte prüfen.`;
    gameError.style.color = "var(--success)";
    gameError.style.background = "rgba(52, 211, 153, 0.08)";
    gameError.style.borderColor = "rgba(52, 211, 153, 0.2)";
    gameError.classList.remove('hidden');
  } else {
    gameError.classList.add('hidden');
  }
  
  if (!prefilledLetters) {
    boxes[0].focus();
  }
}

function resetGameError() {
  gameError.classList.add('hidden');
  gameError.style.color = "var(--error)";
  gameError.style.background = "rgba(248, 113, 113, 0.08)";
  gameError.style.borderColor = "rgba(248, 113, 113, 0.2)";
}

limitedCheckbox.addEventListener('change', () => {
  if (limitedCheckbox.checked) {
    limitedContainer.classList.remove('hidden');
    limitedInput.focus();
  } else {
    limitedContainer.classList.add('hidden');
  }
});

function normalize(str) {
  return str.toLowerCase().replace(/[^a-zäöüß]/g, '');
}

// --- GUESSING LOGIC ---
guessBtn.addEventListener('click', async () => {
  resetGameError();
  resultsContainer.classList.add('hidden');
  resultsList.innerHTML = '';
  allMatches = [];
  displayedCount = 0;

  if (!dictionaryByLength[wordLength]) {
    await loadDictionaryForLength(wordLength);
  }

  const pattern = boxes.map(b => b.value.toLowerCase().trim());
  const allowedStr = limitedCheckbox.checked ? normalize(limitedInput.value) : '';
  
  const allowedFreq = {};
  if (allowedStr.length > 0) {
    for (const char of allowedStr) {
      allowedFreq[char] = (allowedFreq[char] || 0) + 1;
    }
  }

  const regexStr = '^' + pattern.map(l => l === '' ? '.' : l).join('') + '$';
  const regex = new RegExp(regexStr, 'i');

  const candidates = dictionaryByLength[wordLength] || [];

  for (const word of candidates) {
    if (!regex.test(word)) continue;
    
    if (allowedStr.length > 0) {
      const wordFreq = {};
      for (const char of word) {
        wordFreq[char] = (wordFreq[char] || 0) + 1;
      }
      
      let valid = true;
      for (const char in wordFreq) {
        if ((allowedFreq[char] || 0) < wordFreq[char]) {
          valid = false;
          break;
        }
      }
      if (!valid) continue;
    }

    allMatches.push(word);
    
    if (allMatches.length >= 1000) break; 
  }

  if (allMatches.length === 0) {
    gameError.textContent = 'kein passendes wort gefunden. versuche andere buchstaben.';
    gameError.classList.remove('hidden');
    return;
  }

  resultsContainer.classList.remove('hidden');
  renderMoreResults();
});

function renderMoreResults() {
  const nextBatch = allMatches.slice(displayedCount, displayedCount + BATCH_SIZE);
  
  for (const word of nextBatch) {
    const div = document.createElement('div');
    div.className = 'result-item';
    div.textContent = word.toUpperCase();
    resultsList.appendChild(div);
  }

  displayedCount += nextBatch.length;

  if (displayedCount >= allMatches.length) {
    loadMoreBtn.classList.add('hidden');
  } else {
    loadMoreBtn.classList.remove('hidden');
  }
}

loadMoreBtn.addEventListener('click', renderMoreResults);

// --- RESET LOGIC ---
resetBtn.addEventListener('click', () => {
  panelGame.classList.remove('active');
  panelMenu.classList.add('active');
  lengthInput.value = '';
  startBtn.disabled = true;
  limitedInput.value = '';
  resetGameError();
});

})();
</script>
</body>
</html>
